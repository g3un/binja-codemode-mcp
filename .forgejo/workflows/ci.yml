name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: codeberg-small
    container:
      image: nixos/nix:latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Install CI prerequisites
        run: |
          mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' > /etc/nix/nix.conf
          nix profile install nixpkgs#git nixpkgs#nodejs

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Install dependencies
        run: nix develop path:$PWD --command uv sync --frozen --all-groups

      - name: Check formatting
        run: nix develop path:$PWD --command uv run ruff format --check .

      - name: Lint
        run: nix develop path:$PWD --command uv run ruff check .

      - name: Test
        run: nix develop path:$PWD --command uv run pytest

      - name: Check package build
        run: nix develop path:$PWD --command uv build
