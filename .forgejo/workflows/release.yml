name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: codeberg-small
    container:
      image: nixos/nix:latest
    defaults:
      run:
        shell: sh

    steps:
      - name: Install CI prerequisites
        run: |
          mkdir -p /etc/nix
          printf '%s\n' 'experimental-features = nix-command flakes' > /etc/nix/nix.conf
          nix profile add nixpkgs#nodejs

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Check release tag
        env:
          FORGEJO_REF_NAME: ${{ github.ref_name }}
        run: nix develop path:$PWD --command uv run --frozen --all-groups python scripts/create_forgejo_release.py --check-tag

      - name: Run checks
        run: nix flake check path:$PWD

      - name: Create Forgejo release
        env:
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_REF_NAME: ${{ github.ref_name }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: nix develop path:$PWD --command uv run --frozen --all-groups python scripts/create_forgejo_release.py
